# /etc/nginx/conf.d/sp-admin.conf
# 后台静态站单独由 nginx 托管：站点根目录放 admin 的 dist-nginx 产物，
# /api 反代到同一台（或另一台）机器上的 .NET 后端。
server {
    listen 7789;
    server_name _;

    # 解压 sp-admin-nginx-*.zip 的目录，里面直接是 index.html 与 assets/
    root /var/www/sp-admin;
    index index.html;

    # 语音上传与截图附件走 JSON/表单，默认 1m 不够
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 聊天接口是 SSE 流式返回，必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 前端是 BrowserRouter，刷新 /users 这类地址要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源可以长缓存，index.html 不能缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
